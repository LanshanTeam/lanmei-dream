# 管理面板前端（nginx 托管静态资源 + /api 反向代理到 lanmei 管理面板）
#
# 关键点：
#   - 保留客户端 Host（proxy_set_header Host $host），保证后端 CSRF 同源校验（Origin == Host）；
#   - /api 代理关闭缓冲，保证 SSE 实时流（Trace 审计）逐条推送；
#   - SPA 历史路由刷新回退 index.html。

server {
    listen 80;
    server_name _;

    # 前端静态资源（vite 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 带内容哈希的静态资源（vite assets/*）：长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理面板 API：反向代理到 lanmei 内嵌 Fiber 服务（:8090）
    location /api/ {
        proxy_pass http://lanmei:8090;

        # 知识库文件上传：nginx 默认 1m，不改会在 nginx 层直接 413（后端 Fiber
        # BodyLimit 同样为 16MB，两处需保持一致）
        client_max_body_size 16m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE（/api/conduit/traces/stream）：禁用缓冲保证实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA 回退：非静态资源请求一律返回 index.html（前端历史路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
