# Lanmei 主配置文件：只放非敏感配置，API Key / 密码等敏感信息通过环境变量注入。
# 环境变量前缀为 LANMEI_（如 LANMEI_AI_LLM_API_KEY），同名环境变量优先于本文件。
# 各键的代码默认值见 internal/config/init.go 的 setDefaults。

# Agent 原生联网工具（不是业务插件），部署验收后开启；详见 docs/web-search.md。
[ai.web_search]
enabled = true
base_url = "http://openserp:7000"
engines = ["bing", "baidu"]
mode = "any"
max_results = 5
timeout_seconds = 10
max_calls_per_turn = 2
total_search_seconds = 15
answer_reserve_seconds = 10
max_concurrency = 2
requests_per_minute_per_scope = 6
burst_per_scope = 2
cache_ttl_seconds = 120
cache_max_entries = 256
max_response_bytes = 1048576
max_output_bytes = 16384

# 意图判断适配器（群聊"意图+提及判断"的实现选型）。
# api_key 留空 → 走 LLM 意图判断（原路径）；配置 OpenRouter API Key → 启用 Jev 适配器
# （TypeSafe System-1 结构化决策模型，经 OpenRouter 决策端点调用，非 OpenAI chat 格式）。
[ai.intent_judge]
api_key = ""
base_url = "https://openrouter.ai/api/alpha/decisions"
model = "typesafe/jev-1.13"
timeout_seconds = 3

[bot]
# 机器人昵称；为空时代码回退为"蓝妹"
nickname = "蓝妹"
# 超级用户，格式 platform:userID 逗号分隔（如 qq:123456,wechat:wxid_xxx）；留空则无超管
super_users = ""
# 注意：当前代码未读取 mention_suffix，本项无实际效果（历史遗留键）
mention_suffix = ""

[bot.gateway]
# 网关监听地址；容器内须为 0.0.0.0
listen_addr = "0.0.0.0:8080"
# access_token 不在本文件配置，仅通过环境变量 LANMEI_BOT_GATEWAY_ACCESS_TOKEN 设置，
# 留空表示不鉴权（仅建议本地开发）。

# 群聊话题（Topic）系统未在本文件展开，当前沿用代码默认值：
# bot.topic.enabled=true、topic_window_msgs=20、cooling_timeout_minutes=30、
# semantic_threshold=0.5、credit_enabled=true、linguistic_strong/weak_threshold=0.7/0.4、
# archive_interval_seconds=60；nicknames 为空时使用 bot.nickname。
# 总开关可用环境变量 LANMEI_TOPIC_ENABLED 覆盖，其余键需要时自行新增 [bot.topic] 分组。

[bot.stream]
# 流式段落发送间隔配置（模拟真人打字节奏，避免平台乱序）
# 间隔 = 下一段字数 × typing_speed_ms，再 clamp 到 [min, max]，最后加 ±jitter_pct 抖动
typing_speed_ms = 150    # 打字速度：毫秒/字
min_interval_ms = 1000   # 最小间隔（毫秒）
max_interval_ms = 5000  # 最大间隔（毫秒），0 表示不限
jitter_pct = 0.25        # 间隔抖动比例（0.0-1.0），0 表示无抖动

# 多媒体（RustFS 对象存储 + 视觉理解）
# 视觉模型复用主 LLM 的 base_url / api_key（OpenAI 兼容多模态端点），
# 用于：图片消息的 AI 描述（MediaPass）、表情入库自动打标（/添加表情）。
# 注意：vision_model 留空会回退主对话模型（纯文本模型无法识图），启用视觉必须显式指定。
# 存储端点与凭据（endpoint / access_key / secret_key / bucket / region）由环境变量
# LANMEI_MEDIA_* 注入；未配置时媒体管线降级（仅记录，不缓存、不描述）。
[bot.media]
vision_enabled = true
vision_model = "deepseek-v4-flash-vision-exp"

# 日志：level 取值 debug/info/warn/error（默认 info）。
# persistent=false 仅输出到控制台；true 时写入 path，并按 max_size（单文件上限，MB）、
# max_age（保留天数）、max_backups（旧文件个数）轮转，compression 控制旧文件是否压缩。
[log]
level = "info"
persistent = false
path = "./logs/lanmei.log"
compression = true
max_size = 100
max_age = 30
max_backups = 10

[plugin]
# Wasm 动态插件根目录（管理面板安装的插件存放于此）
root_dir = "./data/plugins"
# 网易云点歌 API 服务地址（ncm-api），为空时 /music 提示"音乐服务未配置"
ncm_url = ""
# 点歌结果发送方式（适配不同反向代理工具）：
#   auto = 发语音 record 段（OneBot 端自动转码，点击即听），取不到音频时降级文字链接（默认）
#   card = 强制发 OB11 music 段（音乐卡片，需工具支持签名，如配好 musicSignUrl 的 NapCat）
#   link = 强制发文字链接（最通用）
music_send_mode = "auto"

# 内置业务插件开关（配置驱动注册，无需改代码即可启停）
# 若同名插件已由 Wasm 动态加载，内置注册自动跳过，避免重复
[plugin.builtins]
signin = true      # 签到插件
welcome = true     # 入群欢迎插件
poke = true        # 戳一戳回复插件
three_g = true     # 3G 关键词科普插件
zhaoxin_group = true # 招新群导航插件
rank = true        # 签到积分排行榜插件
cat = true         # 猫猫图片插件
balogo = true      # 蔚蓝档案 LOGO 插件
ping = true        # 连通性测试插件
github_card = true # GitHub 链接卡片插件
music = true       # 网易云点歌插件
sticker = true     # 自定义表情库插件
turtle_soup = true # 海龟汤文字游戏插件
random_beauty = true # 严格安全审核的 Pixiv 随机美图插件
antifraud = true # 反诈插件（需同时配置 [plugin.antifraud].endpoint，见 docs/anti-fraud.md）
# 未列出的开关取代码默认值：answer_question（编程答题）、daily_quote（每日一句）默认开启，
# 其余未列出的内置插件默认关闭。

# 随机美图：使用 Random Mage 兼容 API，安全过滤与视觉审核是代码级安全下限，不可关闭。
# 依赖对象存储与视觉审核：对象存储未配置时图池不可用（取图直接降级提示）；
# 视觉审核未配置时无法补图，只能发送池内既有图片。
[plugin.random_beauty]
api_base_url = "https://i.mukyu.ru"
timeout_seconds = 18 # 补图单张的候选+下载预算（秒），同时是上游 HTTP 客户端超时；取值 1~30，超范围回退 18
max_attempts = 2 # 获取、下载、文件校验或视觉审核失败时重试，硬上限 2
# 同一用户两次取图的最小间隔（秒），按平台+会话+用户维度生效；<0 回退 30
cooldown_seconds = 30
# 单张图片字节上限；>10MB 或 <=0 一律回退 10MB
max_image_bytes = 10485760
# 候选图片最小宽度、最小高度与最少收藏数（元数据过滤）；非法值分别回退 720、720、100
min_width = 720
min_height = 720
min_bookmarks = 100
# 视觉审核判定"安全"的置信度下限（0~1），超范围回退 0.9
safe_confidence = 0.9
# 补图单张视觉审核超时（秒）；取值 1~20，超范围回退 8
moderation_timeout_seconds = 8
# 未列出的键取代码默认值：pool_init_size=100（图池种子目标张数，夹在 10~500）、
# refill_moderation_timeout_seconds=25（补图单张审核含上传预算，夹在 5~30）。

# 反诈插件：把消息异步送 LanmeiAntiFraud 推理服务判定，高置信度违规自动撤回+禁言并上报，
# 中置信度入库并上报，由管理员在管理面板审批。判定全程在插件自有协程中执行，不阻塞消息管线。
# 完整部署与调优说明见 docs/anti-fraud.md；未列出的键取代码默认值（见 internal/config/config.go）。
[plugin.antifraud]
# 推理服务地址（如 http://antifraud:8000）；为空即使开关打开也不注册插件
endpoint = ""
# 自动处置阈值：违规分（1 - P(正常)）达到该值自动撤回+禁言并上报
auto_threshold = 0.9
# 上报阈值：达到该值入库并上报管理员，等人工审批；低于该值不记录
report_threshold = 0.6
# 自动处置的禁言时长（秒），默认 1 小时；0 表示自动处置不禁言（只撤回并上报）
mute_seconds = 3600
# 参与判定的最短文本长度（rune），过短的消息（如"在吗"）不判定
min_chars = 4
# 是否判定私聊消息；默认只判定群聊
monitor_private = false
# 判定范围：group_whitelist 非空时只判定白名单内的群；group_blacklist 内的群永不判定
group_whitelist = []
group_blacklist = []
# 跳过超管与动态管理员的消息（避免误伤管理操作），默认开启
skip_super_users = true
# 入库与送判的文本上限（rune），超出部分截断
max_content_chars = 1000

# 限流与队列（保护推理服务与消息主流程）
user_cooldown_seconds = 10 # 同一用户两次判定的最小间隔；冷却期内不再判定
queue_size = 256 # 待判定队列长度，满则丢弃并计数
batch_size = 16 # 单次提交的最大文本数
batch_window_millis = 200 # 聚合窗口（毫秒）：攒批最多等这么久
max_batches_per_second = 2 # 提交速率上限（批/秒）
request_timeout_seconds = 8 # 单批判定总预算（含轮询，秒）
cache_ttl_seconds = 600 # 相同文本的判决缓存；命中的文本不再调用模型
dedup_window_seconds = 120 # 同用户同文本的记录合并窗口，避免刷屏式重复入库
circuit_failures = 5 # 连续失败多少次后熔断（暂停调用）
circuit_open_seconds = 60 # 熔断持续秒数

# 上报：违规记录私聊超管与动态管理员，并（可选）发到告警群
notice_group_id = "" # 反诈告警群 ID；为空时只私聊管理员
panel_base_url = "" # 管理面板地址（如 https://panel.example.com），用于上报中的记录链接
# 违规记录保留天数；0 表示永久保留
retention_days = 90

# 管理面板服务。
# 认证敏感配置（LANMEI_MANAGER_ADMIN_USERNAME / LANMEI_MANAGER_ADMIN_PASSWORD / LANMEI_MANAGER_SECRET_KEY）
# 仅通过环境变量注入，不写入本文件。
# enabled=false 时面板不启动；docker-compose 用 LANMEI_MANAGER_ENABLED=true 覆盖本项。
[manager]
enabled = false                    # 管理面板总开关
listen_addr = "0.0.0.0:8090"       # 面板监听地址（生产建议绑定内网/VPN 网段）
trace_retention_days = 7           # conduit_trace 保留天数
access_token_ttl_minutes = 15      # 短期 Access Token 有效期（分钟）
refresh_token_ttl_hours = 168      # 长期 Refresh Token 有效期（小时）
enable_webauthn = true             # WebAuthn(passkey) 总开关
# webauthn_rpid = "lanmei.example.com"  # passkey 要求域名；IP 部署留空则自动回退密码登录
# webauthn_display_name = "Lanmei Manager"
# webauthn_origins = ["https://lanmei.example.com"]
rate_limit_per_minute = 20         # 登录类接口限流（次/分钟/IP）
session_max_per_user = 10          # 单账号最大活跃会话数
max_login_fails = 5                # 连续登录失败锁定阈值
login_lock_minutes = 15            # 登录锁定分钟数
# trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]  # 位于反向代理后时配置

# Prompt 系统：dir 为提示词根目录，config 为提示词主配置（均相对程序运行目录）。
[prompts]
dir = "./prompts"
config = "./prompts/prompts.toml"

# Skill 系统：dir 为技能目录（每个技能一个子目录，含 manifest.toml 与 SKILL.md），
# config 为技能启用开关文件（见 config/skills.toml）。
[skills]
dir = "./skills"
config = "./config/skills.toml"

# 编程答题题库。
# 目录结构：quizdata/<语言目录>/*.json（目录名即语言标识）。
# 新增语言 = 新增目录 + JSON 文件，无需改代码；文件变更会被热更新。
# dir 缺失或无可解析题目时 /答题 提示题库为空，不影响启动。
[quiz]
dir = "./quizdata"

# 知识库系统：启用后按 bases 列表构建各知识库。
# 代码默认 enabled=false（此处显式打开）；LANMEI_KNOWLEDGE_ENABLED 与
# LANMEI_KNOWLEDGE_AUTO_RECALL_LIMIT 环境变量优先于本文件。
[knowledge]
# 总开关：关闭时不构建任何 bases，代码默认为 false（此处显式打开）
enabled = true                     # 知识库总开关
# 可选 vector（向量）/fuzzy（模糊）/time（时间），多路命中按下面 weights 加权合并；
# 空数组表示使用各 provider 的全部能力
default_recall_modes = ["vector", "fuzzy"]  # 隐式召回与 kb_search 的默认模式
# 取值 <=0 时回退 3
auto_recall_limit = 3               # 每轮对话隐式召回注入的条数

[knowledge.weights]
vector = 1.0                        # 向量召回权重
fuzzy = 0.8                         # 模糊召回权重
time = 0.5                          # 时间召回权重

# 本地知识库：PostgreSQL + pgvector 向量召回 + pg_trgm 模糊召回，docs_dir 下文件自动同步。
[[knowledge.bases]]
id = "main"
name = "主知识库"
description = "本地文件知识库，docs_dir 下的 Markdown / CSV 自动同步"
provider = "local"
enabled = true
recall_limit = 5                    # 单模式召回上限

[knowledge.bases.config]
docs_dir = "./docs"                 # 知识文件目录（相对程序运行目录），支持 .md 与 .csv
# 管理面板的"知识文件"上传落在 <docs_dir>/uploads（同名覆盖，上传/删除后自动同步）；
# 该子目录需在容器内可写（docker-compose 已单独挂载），其余知识文件保持只读
fuzzy_threshold = 0.1               # 模糊召回最低相似度阈值
# CSV 规则表说明：
#   与飞书表格结构同构：A 列=关键词、B 列=回复（C 列匹配形式忽略），每行一条知识。
#   CSV 放入 docs_dir（如 docs/rules.csv）后启动或"重新同步"即自动摄入，
#   检索命中后由 LLM 组织回答（即"AI检索"行为）。
csv_skip_header = true              # 是否跳过 CSV 首行表头

# 飞书知识库（Wiki，应用身份访问）。
# 凭据支持 "env:VAR_NAME" 语法从环境变量读取，避免敏感信息入库。
# [[knowledge.bases]]
# id = "feishu-main"
# name = "飞书知识库"
# description = "飞书知识空间文档"
# provider = "feishu"
# enabled = true
# recall_limit = 5
#
# [knowledge.bases.config]
# app_id = "env:FEISHU_APP_ID"
# app_secret = "env:FEISHU_APP_SECRET"
# # space_id = ""                    # 缺省取第一个有权限的知识空间
# # node_token = ""                  # 起始节点，缺省从空间根节点遍历
# max_nodes = 200                    # 拉取节点数上限
# fuzzy_threshold = 0.1              # 模糊召回最低分数
# cache_ttl_seconds = 600            # 文档/向量缓存有效期（秒）
# fetch_workers = 8                  # 拉取文档内容并发数
