# 蓝妹全栈编排：postgres/redis/rustfs 为基础设施，lanmei 为应用本体，
# manager-web 提供管理面板入口，onebots/napcat 负责接入 IM 平台。
# 所有 ${VAR:-默认值} 均可用同目录 .env 覆盖（见 .env.example）。

services:
  # 可选 Agent 联网搜索；固定源码构建基线，不使用浮动 latest。
  # 无宿主机端口映射、无 lanmei 强制依赖；启用步骤见 docs/web-search.md。
  openserp:
    image: ${OPENSERP_IMAGE:-lanmei-openserp:112593b8e17c084f3e9943b8fd9861c6570feca0}
    build:
      context: https://github.com/karust/openserp.git#112593b8e17c084f3e9943b8fd9861c6570feca0
    profiles: ["websearch"]
    restart: unless-stopped
    init: true
    command: ["serve", "-a", "0.0.0.0", "-p", "7000"]
    volumes:
      - ./config/openserp.yaml:/usr/src/app/config.yaml:ro
    cpus: 2.0
    mem_limit: 2g
    shm_size: 256m
    # 不以真实搜索作探活；停用镜像内置检查，部署时单独低频验收。
    healthcheck:
      test: ["NONE"]

  # PostgreSQL 18（pgvector 官方镜像）：业务数据与知识库向量检索，数据存 pgdata 卷。
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # 默认用户/密码/库名均为 lanmei，可用 .env 的 POSTGRES_* 覆盖
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lanmei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanmei}
      POSTGRES_DB: ${POSTGRES_DB:-lanmei}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # pg18+ 要求挂载到 /var/lib/postgresql（自动创建版本子目录，支持 pg_upgrade --link）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanmei}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis 7（Alpine）：Conduit 状态存储（会话、话题、冷却等运行时状态）。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 状态数据可丢：限制 64MB 内存并按 LRU 淘汰，避免挤占宿主机
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RustFS（S3 兼容对象存储）：缓存多媒体文件与随机美图图池，数据存 rustfsdata 卷。
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    restart: unless-stopped
    # 凭据默认 lanmei/lanmei-secret，可用 .env 的 RUSTFS_* 覆盖
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lanmei}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lanmei-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
    volumes:
      - rustfsdata:/data

  # 网易云音乐 API（点歌插件依赖，提供 /search 等接口）。
  # 原版 binaryify 镜像稳定且无需 xeapi 加密公钥；增强版 moefurina/ncm-api
  # 依赖动态获取 xeapi 公钥（"xeapi public key is missing"），实测 /search 不可用。
  ncm-api:
    image: binaryify/netease_cloud_music_api:latest
    restart: unless-stopped
    ports:
      - "${NCM_API_PORT:-3000}:3000"

  # 反诈推理服务（LanmeiAntiFraud）：可选，默认不启动，需 `--profile antifraud`。
  # 镜像与构建上下文二选一：
  #   - 已有镜像（离线分发）：make antifraud-image-load 导入后直接使用；
  #   - 本地源码构建：LANMEI_ANTIFRAUD_DIR 指向 LanmeiAntiFraud 仓库（默认 ../LanmeiAntiFraud/LanmeiAntiFraud），
  #     执行 `docker compose --profile antifraud build antifraud`。
  # 刻意不映射宿主端口：模型服务自身无鉴权，只允许 compose 内网调用；需要外部访问时自行加反代与鉴权。
  # 常驻内存约 3GB，首次启动加载模型约 10s（healthcheck 有 120s 启动宽限）。
  antifraud:
    image: ${LANMEI_ANTIFRAUD_IMAGE:-lanmei-antifraud:latest}
    build:
      context: ${LANMEI_ANTIFRAUD_DIR:-../LanmeiAntiFraud/LanmeiAntiFraud}
      args:
        TORCH_INDEX: ${LANMEI_ANTIFRAUD_TORCH_INDEX:-cpu}
    profiles: ["antifraud"]
    restart: unless-stopped
    init: true
    environment:
      # 推理线程数（CPU 机型建议接近核数）；任务结果保留 1800s，够插件轮询与排障
      LMAF_WORKERS: ${LANMEI_ANTIFRAUD_WORKERS:-4}
      LMAF_TASK_TTL: "1800"
    mem_limit: 4g
    cpus: 4.0

  # 蓝妹 Bot 本体（由仓库根目录 Dockerfile 构建）：先加载 .env，再用 environment 覆盖容器内地址。
  lanmei:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内数据库/Redis 地址按服务名拼装（.env 中的 localhost 仅用于本地开发）
      LANMEI_DATABASE_URL: postgres://${POSTGRES_USER:-lanmei}:${POSTGRES_PASSWORD:-lanmei}@postgres:5432/${POSTGRES_DB:-lanmei}?sslmode=disable
      LANMEI_REDIS_ADDR: redis:6379
      # 网关监听地址（容器内必须为 0.0.0.0，宿主机端口由 LANMEI_PORT 映射）
      LANMEI_BOT_GATEWAY_LISTEN_ADDR: "0.0.0.0:8080"
      # 网关鉴权 token，默认空 = 不鉴权；须与 Onebots / NapCat 配置中的 token 一致
      LANMEI_BOT_GATEWAY_ACCESS_TOKEN: ${LANMEI_BOT_GATEWAY_ACCESS_TOKEN:-}
      # 网易云点歌 API（ncm-api 服务，覆盖 config.toml 的 plugin.ncm_url）
      LANMEI_PLUGIN_NCM_URL: http://ncm-api:3000
      # 反诈推理服务地址（antifraud 服务，需 --profile antifraud 启动；覆盖 config.toml 的 plugin.antifraud.endpoint）。
      # 插件是否注册仍由 config.toml 的 [plugin.builtins].antifraud 决定，见 docs/anti-fraud.md
      LANMEI_PLUGIN_ANTIFRAUD_ENDPOINT: ${LANMEI_PLUGIN_ANTIFRAUD_ENDPOINT:-http://antifraud:8000}
      # 点歌结果发送方式：auto = 发语音（record 段，点击即听，无需签名服务）；
      # 取不到音频时自动降级文字链接。card 需工具支持音乐签名，link 为纯文字。
      LANMEI_PLUGIN_MUSIC_SEND_MODE: auto
      # RustFS 多媒体对象存储（凭据与上面 rustfs 服务保持一致）
      LANMEI_MEDIA_ENDPOINT: http://rustfs:9000
      LANMEI_MEDIA_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lanmei}
      LANMEI_MEDIA_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lanmei-secret}
      # 对象存储桶名，默认 lanmei-media；桶不存在时首次写入自动创建
      LANMEI_MEDIA_BUCKET: ${LANMEI_MEDIA_BUCKET:-lanmei-media}
      # 管理面板：经 nginx（manager-web）托管前端并反代 /api，故启用内嵌 Fiber 服务
      LANMEI_MANAGER_ENABLED: "true"
      LANMEI_MANAGER_LISTEN_ADDR: "0.0.0.0:8090"
      # 超管凭据与加密主密钥（仅环境变量，不落盘；缺失/过弱时 lanmei 启动失败）
      LANMEI_MANAGER_ADMIN_USERNAME: ${LANMEI_MANAGER_ADMIN_USERNAME:-}
      LANMEI_MANAGER_ADMIN_PASSWORD: ${LANMEI_MANAGER_ADMIN_PASSWORD:-}
      LANMEI_MANAGER_SECRET_KEY: ${LANMEI_MANAGER_SECRET_KEY:-}
    volumes:
      # 配置文件目录（只读）：包含 config.toml 与 skills.toml 等运行时配置
      - ./config:/app/config:ro
      # Prompt 系统（只读）
      - ./prompts:/app/prompts:ro
      # Skill 系统（只读）
      - ./skills:/app/skills:ro
      # 编程答题题库（只读）
      - ./quizdata:/app/quizdata:ro
      # 知识库目录（只读）：Markdown / CSV 文件自动摄入
      - ./docs:/app/docs:ro
      # 面板上传的知识文件目录（可写）：嵌套挂载覆盖上一条的只读，
      # 保证人工维护的知识文件在容器内仍不可改，只有 uploads 子目录可写；
      # 该子目录位于 docs_dir 内，上传/删除后由面板触发的同步摄入与清理
      - ./docs/uploads:/app/docs/uploads
    ports:
      - "${LANMEI_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      ncm-api:
        condition: service_started

  # 管理面板前端（nginx 托管静态资源，/api 反向代理到 lanmei:8090）。
  # 访问入口：http://<host>:${MANAGER_WEB_PORT:-80}（前端与 /api 同源，CSRF 校验通过）
  manager-web:
    build:
      context: ./manager
    restart: unless-stopped
    ports:
      - "${MANAGER_WEB_PORT:-80}:80"
    depends_on:
      lanmei:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Onebots 网关（统一 IM 平台适配层）：按 config/onebots/config.yaml 以反向 WS 连接
  # 蓝妹的 /onebot/v11、/onebot/v12 端点（地址见 LANMEI_BOT_GATEWAY_LISTEN_ADDR）。
  onebots:
    image: ghcr.io/lc-cn/onebots:master
    container_name: onebots
    restart: unless-stopped
    volumes:
      - onebots:/data
      - ./config/onebots/config.yaml:/data/config.yaml
    depends_on:
      lanmei:
        condition: service_started

  # NapCat（NTQQ 平台 Provider，OneBot 11 方言）：以反向 WS 连接蓝妹网关；
  # 地址与 token 在 config/napcat/onebot11.json 中配置，须与 LANMEI_BOT_GATEWAY_* 对应。
  napcat:
    image: mlikiowa/napcat-docker:v4.18.19
    container_name: napcat
    restart: unless-stopped
    environment:
      NAPCAT_GID: ${NAPCAT_QQ_NUMBER:-}
      NAPCAT_UID: ${NAPCAT_QQ_NUMBER:-}
    volumes:
      - napcat:/app/napcat/config
      # 三个配置只读挂载（:ro）：NapCat 运行期不会改写，修改请直接编辑宿主机文件
      - ./config/napcat/onebot11.json:/app/napcat/config/onebot11.json:ro
      - ./config/napcat/napcat.json:/app/napcat/config/napcat.json:ro
      - ./config/napcat/napcat_protocol.json:/app/napcat/config/napcat_protocol.json:ro
    depends_on:
      lanmei:
        condition: service_started

# 命名卷：数据持久化（docker compose down 不会删除，需 down -v 才清理）
volumes:
  pgdata:
  rustfsdata:
  onebots:
  napcat:
